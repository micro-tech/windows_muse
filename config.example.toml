# Muse Windows app — hub config (EXAMPLE — copy, do not commit the real one)
#
# Copy this file to the app's config directory and fill in your own token:
#   Windows: %APPDATA%\muse-windows-app\config.toml
#   Linux:   ~/.config/muse-windows-app/config.toml
#
# The token is a chat-hub token minted for this app. It lives ONLY in that
# on-machine file — never in the repo, never in chat, never in a screenshot.
# If this file is missing, or the token is still the placeholder below, the
# hub watcher stays disabled and the UI says "hub: not configured".

# Base URL of the chat hub (John's hub — not a secret, it is his own domain).
hub_url = "https://chat.micro-tech.xyz"

# Bearer token for the hub. Replace the placeholder with your own token.
hub_token = "PASTE_YOUR_HUB_TOKEN_HERE"

# Senders whose `!` commands the watcher will run. The hub stamps the sender
# from the token, so only these two can drive the terminal. The same list
# also gates `crew`-room posts — only these senders can light up the
# sub-agent pane.
allowed_senders = ["cobble-jr", "john"]

# This app's hub agent name, for the `to` addressing check: a structured
# `!` message addressed to a different agent is ignored entirely (no run,
# no reply). Defaults to "john" when the key is absent — the app uses the
# john hub token, so "john" is its name. Only change this if the app ever
# gets its own hub token under a different name.
# agent_name = "john"

# MCP servers (stdio), for the `how: "mcp"` path. Default: none configured.
# Each server is launched with its `command` + `args` when a tool call
# addresses it by name, e.g. `!{"how": "mcp", "to": "john", "server": "fs",
# "tool": "read_file", "args": {"path": "C:\\notes\\todo.txt"}, "scope": "read"}`.
# v1 is READ-ONLY: only the tools listed in a server's `read_tools` may be
# called via the hub, and a `write:` scope is rejected outright. List only
# the tools you know are read-only for each server; a tool not on the list
# is rejected even if the server offers it. Add a `[mcp.servers.<name>]`
# section per server you want callable from the hub.
# [mcp.servers.fs]
# command = "C:\\tools\\fs-mcp.exe"
# args = []
# read_tools = ["read_file", "list_dir"]
